<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube</title>

    <link rel="stylesheet" href="style1.css">

    <style>
        .header {
            display: flex;
            width: 100%;
            height: 70px;
            align-items: center;
        }

        .left-section,
        .middle-section,
        .right-section {
            flex: 1;
        }

        .left-section {
            display: flex;
            align-items: center;
        }

        .youtube-logo {
            width: 120px;
            margin-left: 20px;
        }

        .middle-section {
            max-width: 500px;
            margin-left: 70px;
            margin-right: 35px;
        }

        .search-bar {
            border-radius: 2px;
            width: 100%;         
            height: 40px;
            padding: 0 15px;
            border: 1px solid white;
            border-radius: 20px;
            font-size: 16px;
        }

        .right-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
        }

        .search {
            margin: 20px 0;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .karta1 {
            width: 300px;
        }

        .thumbnail {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .info {
            display: flex;
            align-items: flex-start;
            margin-top: 10px;
        }

        .profilovka {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .text {
            flex: 1;
        }

        .name1 {
            font-weight: bold;
        }

        .views1 {
            color: gray;
            font-size: 14px;
        }

        .more {
            font-size: 24px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="left-section">
            <img
                class="youtube-logo"
                src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg"
                alt="YouTube logo"
            >
        </div>

        <div class="middle-section">
            <input
                class="search-bar"
                type="text"
                placeholder="Hľadať"
            >
        </div>

        <div class="right-section">
            <img
                class="profile-icon"
                src="https://www.pesweb.cz/api/media/uploads/large_Cesky_horsky_pes_atlas_psich_plemen_3b1edb592b_fa26a78251.png"
                alt="Profilová ikona"
            >
        </div>

    </div>


    <h1>YouTube</h1>


    <div class="search">
        <input type="text" placeholder="Search">
        <button>Search</button>
    </div>


    <div class="container">


  
        <div class="karta1">

            <img
                class="thumbnail"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_Vt8ai1v0iG3UYhVxO0cQEyE8FG24QOvG4_wTCbuNomuzVv6yQjx_g6c&s=10"
                alt="YouTube video"
            >

            <div class="info">

                <img
                    class="profilovka"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_Vt8ai1v0iG3UYhVxO0cQEyE8FG24QOvG4_wTCbuNomuzVv6yQjx_g6c&s=10"
                    alt="Profilovka"
                >

                <div class="text">

                    <span class="name1">
                        Co robia osipane vo volnom case
                    </span>

                    <br>

                    <span class="views1">
                        15 views • 30 billion years ago
                    </span>

                </div>

                <span class="more">⋮</span>

            </div>

        </div>


        <div class="karta1">

            <img
                class="thumbnail"
                src="https://www.pesweb.cz/api/media/uploads/large_Cesky_horsky_pes_atlas_psich_plemen_3b1edb592b_fa26a78251.png"
                alt="YouTube video"
            >

            <div class="info">

                <img
                    class="profilovka"
                    src="https://www.pesweb.cz/api/media/uploads/large_Cesky_horsky_pes_atlas_psich_plemen_3b1edb592b_fa26a78251.png"
                    alt="Profilovka"
                >

                <div class="text">

                    <span class="name1">
                        Ako urobit zabijacku u vas na zahrade
                    </span>

                    <br>

                    <span class="views1">
                        600k views • 30 seconds ago
                    </span>

                </div>

                <span class="more">⋮</span>

            </div>

        </div>


  
        <div class="karta1">

            <img
                class="thumbnail"
                src="https://vedanadosah.cvtisr.sk/wp-content/uploads/importovane/img/articles/njSc7meJ.jpg"
                alt="YouTube video"
            >

            <div class="info">

                <img
                    class="profilovka"
                    src="https://vedanadosah.cvtisr.sk/wp-content/uploads/importovane/img/articles/njSc7meJ.jpg"
                    alt="Profilovka"
                >

                <div class="text">

                    <span class="name1">
                        Najhorsie rozhodnutie bolo byt logista
                    </span>

                    <br>

                    <span class="views1">
                        600k views • 10 years ago
                    </span>

                </div>

                <span class="more">⋮</span>

            </div>

        </div>


    </div>

</body>
</html>
