<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>
<body>
    <div style = "display: flex; flex-direction: row;">
        <div style = "background-color: yellow;">div1</div>
        <div style = "background-color: green;">div2       
        <p>This is Paragraph</p> 
        </div>
    </div>

    <div style = "display: flex; flex-direction: row; margin-top: 30px;">
        <div style = "background-color: yellow;">div1</div>
        <div style = "background-color: green;flex: 1;">div2</div>
    </div>

    <div style = "display: flex; flex-direction: row; margin-top: 30px;border-color: grey;
    border-style: solid; height: 70px;border-width: 1px; justify-content:space-between;">
        <div style = "background-color: yellow; width: 100px; ">div1</div>
        <div style = "background-color: blue; width: 500px; ">div3</div>
        <div style = "background-color: green;width: 100px;">div2</div>
    </div>

    <div style = "display: flex; flex-direction: row; margin-top: 30px;border-color: grey;
    border-style: solid; height: 70px;border-width: 1px; justify-content: space-between;align-items: end;">
        <div style = "background-color: yellow; width: 100px;">div1</div>
        <div style = "background-color: blue; width: 500px;">div3</div>
        <div style = "background-color: green;width: 100px;">div2</div>
    </div>
</body>
</html>
